<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Metas Corridinhas Venda Direta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap">
<style>
/* Layout: coluna central estreita (mobile first), cabeçalho dourado/marinho como a arte do Boleto Médio, busca grande, cartões de loja com meta em destaque. Visual único escuro, igual à arte. */
:root{
  --navy:#07152e;
  --navy-2:#0d2347;
  --cream:#f6efdc;
  --gold:#e9b949;
  --teal:#0b4a52;
  --ink:#0a1a35;
  --muted:#9fb0cc;
  --line:rgba(233,185,73,.28);
  --font-display:"Playfair Display",Georgia,serif;
  --font-body:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:radial-gradient(120% 60% at 50% 0,#13305f 0,var(--navy) 60%) fixed,var(--navy);
  color:var(--cream);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:20px}
.brand i{color:var(--gold);margin-left:6px}
.pill{border:1px solid var(--gold);border-radius:99px;padding:6px 16px;font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--cream)}
h1{margin:0;font-family:var(--font-display);text-wrap:balance;line-height:1.02}
h1 small{display:block;font-style:italic;font-weight:500;font-size:clamp(28px,6vw,40px)}
h1 b{display:block;font-weight:800;font-size:clamp(40px,9vw,58px);color:#fff}
.sub{margin:0;color:var(--muted);max-width:52ch}
.sub strong{color:var(--gold)}
.swoosh{height:3px;width:100%;max-width:420px;border-radius:3px;background:linear-gradient(90deg,var(--gold),transparent)}


.hero{display:flex;flex-direction:column}
.hero-art{position:relative;order:-1}
.photo{display:block;width:100%;height:auto;aspect-ratio:16/11;object-fit:cover;object-position:50% 14%;border-radius:18px;
  -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);mask-image:linear-gradient(to bottom,#000 62%,transparent)}
.didi{position:absolute;right:0;bottom:-6%;width:38%;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.hero-txt{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;margin-top:-52px}
.period{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.period svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:2}
.hint{color:var(--cream);font-weight:600}
h1 b{text-shadow:0 2px 18px rgba(7,21,46,.9)}
@media (min-width:700px){
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:0}
  .hero-art{order:0}
  .hero-txt{margin-top:0;padding-right:8px}
  .photo{aspect-ratio:1/1;object-position:50% 12%;-webkit-mask-image:linear-gradient(to right,transparent,#000 38%);mask-image:linear-gradient(to right,transparent,#000 38%)}
  .didi{left:-6%;right:auto;bottom:-4%;width:44%}
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--navy-2);padding:6px;border-radius:14px;border:1px solid var(--line)}
.tab{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 10px;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab span{font-size:11px;font-weight:500;letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--gold);color:var(--ink)}
.tab:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:18px;font-weight:500;color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:14px;padding:16px 46px 16px 48px}
.search input::placeholder{color:#5d6b85}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:2.2}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--teal);font-size:22px;width:36px;height:36px;cursor:pointer;border-radius:50%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--cream);padding:6px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.count{color:#c4d2ea;font-size:13px;margin:0}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.who{background:var(--cream);padding:14px 12px 14px 16px;color:var(--ink);min-width:0}
.who h2{margin:0;font-size:17px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.who p{margin:4px 0 0;font-size:12px;letter-spacing:.06em;color:#34456a;font-weight:600}
.meta{background:var(--teal);padding:12px 16px;text-align:right;display:flex;flex-direction:column;justify-content:center;min-width:128px;color:var(--cream)}
.meta small{font-size:11px;letter-spacing:.14em;font-weight:700;color:#fff}
.meta strong{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta em{font-style:normal;font-size:12px;color:#e3f0ee;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 0;font-family:var(--font-display);font-style:italic;font-size:16px}
.foot b{color:var(--gold);font-weight:500}
@media (max-width:430px){
  .card{grid-template-columns:1fr}
  .meta{text-align:left;align-items:flex-start;min-width:0}
}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>

  vips:{p:'Durante todo o ciclo',t:'de VIPs',d:'Encontre sua loja e veja a meta de VIPs da corridinha. Bateu a meta no período, garante o prêmio.'}
};
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function brl(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){return n.toLocaleString('pt-BR')}
function render(){
  var q=norm(Q);
  var ul=document.getElementById('list');ul.innerHTML='';
  if(q.length<2)return;
  var rows=DATA.filter(function(r){
    return norm(r[1]).indexOf(q)>-1||String(r[0]).indexOf(q)>-1;
  }).sort(function(a,b){return a[1].localeCompare(b[1],'pt')});
  if(!rows.length){ul.innerHTML='<li class="empty">Nenhuma loja encontrada com esse nome. Confira a grafia.</li>';return}
  rows.forEach(function(r){
    var main=MODE==='atividade'?num(r[3]):brl(r[4]);
    var other=MODE==='atividade'?'VIPs: '+brl(r[4]):'Atividade: '+num(r[3]);
    var li=document.createElement('li');li.className='card';
    li.innerHTML='<div class="who"><h2></h2><p></p></div><div class="meta"><small>'+LBL[MODE]+'</small><strong>'+main+'</strong><em>'+other+'</em></div>';
    li.querySelector('h2').textContent=r[1];
    li.querySelector('p').textContent=r[2]+' · BCPS '+r[0];
    ul.appendChild(li);
  });
}
function setMode(m){
  MODE=m;
  ['atividade','vips'].forEach(function(k){document.getElementById('t-'+k).setAttribute('aria-selected',String(k===m))});
  document.getElementById('ttl').textContent=COPY[m].t;
  document.getElementById('desc').textContent=COPY[m].d;
  document.getElementById('period').textContent=COPY[m].p;
  document.title='Metas Corridinhas Venda Direta';
  render();
}
document.getElementById('t-atividade').onclick=function(){setMode('atividade');location.hash='atividade'};
document.getElementById('t-vips').onclick=function(){setMode('vips');location.hash='vips'};
var qi=document.getElementById('q'),clr=document.getElementById('clr');
qi.oninput=function(){Q=qi.value;clr.hidden=!Q;render()};
clr.onclick=function(){qi.value='';Q='';clr.hidden=true;qi.focus();render()};
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(COPY[h])setMode(h)});
setMode(COPY[location.hash.slice(1)]?location.hash.slice(1):'atividade');
</script>

</body></html>
